name: Stock alerts

on:
  schedule:
    # Every 5 minutes, Mon-Fri, 13:00-21:59 UTC (covers US market hours)
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-alerts

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check thresholds
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 stock-alerts/check.py
      - name: Save alert state
        run: |
          if ! git diff --quiet stock-alerts/state.json; then
            git config user.name "stock-alerts[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add stock-alerts/state.json
            git commit -m "Update stock alert state"
            git push
          fi
