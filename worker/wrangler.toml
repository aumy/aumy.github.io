name = "stock-alerts"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Every minute, Mon-Fri, 13:00-21:59 UTC (covers US market hours)
[triggers]
crons = ["* 13-21 * * 1-5"]

# Create with: npx wrangler kv namespace create STORE   (paste the id below)
[[kv_namespaces]]
binding = "STORE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
ALLOWED_ORIGIN = "https://aumy.github.io"
